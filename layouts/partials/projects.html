<ul class="projects" id="projects">
{{ range site.Data.projects.project }}
    <li>
        <a class="project-name" href="{{ .url | default .repo }}">{{ .name }}</a>
        <span class="project-desc">{{ .desc }}</span>
        {{ if and .url .repo }}<a class="dim" href="{{ .repo }}">src</a>{{ end }}
    </li>
{{ end }}
</ul>
